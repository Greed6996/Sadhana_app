name: Build and Release Sadhana Card APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Decode Production Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "❌ CRITICAL: RELEASE_KEYSTORE_BASE64 secret is missing or empty in GitHub Secrets."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.jks"
        shell: bash

      - name: Build Production Release APK
        run: ./gradlew assembleRelease
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ format('1.0.{0}', github.run_number) }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Verify Production Release APK Signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [ ! -f "$APKSIGNER" ]; then
            echo "Installing Android SDK Build-Tools 35.0.0 via sdkmanager..."
            echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          fi
          if [ ! -f "$APKSIGNER" ]; then
            echo "❌ Failed to locate or install apksigner 35.0.0 at: $APKSIGNER"
            exit 1
          fi

          echo "Validating release APK signature using: $APKSIGNER"
          if ! SIGNATURE_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk 2>&1); then
            echo "❌ apksigner verification failed with output:"
            echo "$SIGNATURE_OUTPUT"
            exit 1
          fi

          ACTUAL_SHA256=$(echo "$SIGNATURE_OUTPUT" | grep -i "Signer #1 certificate SHA-256 digest:" | awk '{print $NF}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED_SHA256="75e471ee7feb55afe62bdc75f4f14a69a76c49a5c184e4664e60a6676886b5aa"

          echo "Expected Fingerprint: $EXPECTED_SHA256"
          echo "Actual Fingerprint:   $ACTUAL_SHA256"

          if [ -z "$ACTUAL_SHA256" ]; then
            echo "❌ FAILED: Could not extract signer certificate SHA-256."
            exit 1
          fi

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "❌ CRITICAL: Fingerprint mismatch! Release APK is NOT signed with the expected production certificate."
            exit 1
          fi

          echo "✅ Production signature verified: APK is authentic and signed with the permanent release key."
        shell: bash

      - name: Secure Cleanup of Release Keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks"
        shell: bash

      - name: Prepare Named APK Binary
        run: cp app/build/outputs/apk/release/app-release.apk Sadhana-Card.apk

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Sadhana-Card-Release-APK
          path: Sadhana-Card.apk
          retention-days: 30

      - name: Automatic GitHub Release
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name) || format('v1.0.{0}', github.run_number) }}
          name: ${{ (startsWith(github.ref, 'refs/tags/') && format('Sadhana Card {0}', github.ref_name)) || format('Sadhana Card v1.0.{0}', github.run_number) }}
          body: |
            ## 🪷 Sadhana Card Android App

            Automated production build for Sadhana Card.

            ### 📱 Direct Download for Android:
            - 🟢 **[Sadhana-Card.apk](https://github.com/Greed6996/Sadhana_app/releases/latest/download/Sadhana-Card.apk)** (Direct download, ready to install)

            ### ✨ Features:
            - 100% Offline & Private Devotional Habit Tracker
            - Daily 20-Point & Weekly 140-Point scoring rubric
            - 7-Day matrix view & aggregate progress
            - Excel (.xlsx) weekly report generation matching official template
            - One-tap WhatsApp sharing with mentors/counselors
            - Sanskrit verses & devotional dedication
          files: |
            Sadhana-Card.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
