name: Build and Release Sadhana Card APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-firestore-rules:
    name: Test Firestore Security Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check for Firestore changes
        id: check_changes
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            DIFF_TARGET="origin/${{ github.base_ref }}"
          else
            DIFF_TARGET="HEAD~1"
          fi
          if git diff --name-only "$DIFF_TARGET" HEAD | grep -E '^(firestore\.rules|firebase\.json|firestore-tests/)'; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Set up Node.js
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java for Firebase Emulator
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firestore Emulator test dependencies
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          cd firestore-tests
          npm install

      - name: Run Firestore Rules Emulator Tests
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          npx --yes firebase-tools emulators:exec --project sadhana-card-test --only firestore "cd firestore-tests && npm test"

  build-apk:
    name: Build Android APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Decode Production Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "❌ CRITICAL: RELEASE_KEYSTORE_BASE64 secret is missing or empty in GitHub Secrets."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.jks"
        shell: bash

      - name: Print Keystore Fingerprints for Firebase
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          echo "================================================================="
          echo "  RELEASE KEYSTORE CERTIFICATE DETAILS & FINGERPRINTS"
          echo "================================================================="
          keytool -list -v -keystore "${{ runner.temp }}/release.jks" -storepass "$RELEASE_KEYSTORE_PASSWORD"
          echo "================================================================="
        shell: bash

      - name: Determine Version
        id: version_meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_TAG="${{ github.ref_name }}"
            VER_NAME="${RAW_TAG#v}"
            PATCH_NUM=$(echo "$VER_NAME" | awk -F. '{print $NF}')
            if [[ "$PATCH_NUM" =~ ^[0-9]+$ ]]; then
              VER_CODE="$PATCH_NUM"
            else
              VER_CODE="30"
            fi
            echo "version_name=$VER_NAME" >> "$GITHUB_OUTPUT"
            echo "version_code=$VER_CODE" >> "$GITHUB_OUTPUT"
            echo "tag_name=$RAW_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "version_name=1.0.30" >> "$GITHUB_OUTPUT"
            echo "version_code=30" >> "$GITHUB_OUTPUT"
            echo "tag_name=v1.0.30" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Build Production Release APK
        run: ./gradlew assembleRelease
        env:
          VERSION_CODE: ${{ steps.version_meta.outputs.version_code }}
          VERSION_NAME: ${{ steps.version_meta.outputs.version_name }}
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Verify Production Release APK Signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [ ! -f "$APKSIGNER" ]; then
            echo "Installing Android SDK Build-Tools 35.0.0 via sdkmanager..."
            echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"
          fi
          if [ ! -f "$APKSIGNER" ]; then
            echo "❌ Failed to locate or install apksigner 35.0.0 at: $APKSIGNER"
            exit 1
          fi

          echo "Validating release APK signature using: $APKSIGNER"
          if ! SIGNATURE_OUTPUT=$("$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk 2>&1); then
            echo "❌ apksigner verification failed with output:"
            echo "$SIGNATURE_OUTPUT"
            exit 1
          fi

          ACTUAL_SHA1=$(echo "$SIGNATURE_OUTPUT" | grep -i "Signer #1 certificate SHA-1 digest:" | awk '{print $NF}')
          ACTUAL_SHA256=$(echo "$SIGNATURE_OUTPUT" | grep -i "Signer #1 certificate SHA-256 digest:" | awk '{print $NF}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED_SHA256="75e471ee7feb55afe62bdc75f4f14a69a76c49a5c184e4664e60a6676886b5aa"

          echo "================================================================="
          echo "🎯 FIREBASE OAUTH / GOOGLE SIGN-IN FINGERPRINTS:"
          echo "-----------------------------------------------------------------"
          echo "SHA-1  (Copy into Firebase Console): $ACTUAL_SHA1"
          echo "SHA-256 (App Verification):          $ACTUAL_SHA256"
          echo "================================================================="

          if [ -z "$ACTUAL_SHA256" ]; then
            echo "❌ FAILED: Could not extract signer certificate SHA-256."
            exit 1
          fi

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "❌ CRITICAL: Fingerprint mismatch! Release APK is NOT signed with the expected production certificate."
            exit 1
          fi

          echo "✅ Production signature verified: APK is authentic and signed with the permanent release key."
        shell: bash

      - name: Secure Cleanup of Release Keystore
        if: always()
        run: rm -f "${{ runner.temp }}/release.jks"
        shell: bash

      - name: Prepare Named APK Binary
        run: cp app/build/outputs/apk/release/app-release.apk Sadhana-Card.apk

      - name: Measure APK Size and Update update.json
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
        env:
          TAG_NAME: ${{ steps.version_meta.outputs.tag_name }}
          VER_NAME: ${{ steps.version_meta.outputs.version_name }}
          VER_CODE: ${{ steps.version_meta.outputs.version_code }}
        run: |
          APK_BYTES=$(stat -c%s Sadhana-Card.apk)
          APK_SIZE_MB=$(awk -v b="$APK_BYTES" 'BEGIN {printf "%.1f MB", b / 1048576}')
          echo "Real APK Size: $APK_BYTES bytes -> $APK_SIZE_MB"
          export APK_SIZE_MB

          python3 -c "
          import os, json
          tag = os.environ['TAG_NAME']
          ver_name = os.environ['VER_NAME']
          ver_code = int(os.environ['VER_CODE'])
          apk_size = os.environ['APK_SIZE_MB']

          with open('update.json', 'r') as f:
              data = json.load(f)

          data['approvedVersion'] = ver_name
          data['approvedVersionCode'] = ver_code
          data['downloadUrl'] = f'https://github.com/Greed6996/Sadhana_app/releases/download/{tag}/Sadhana-Card.apk'
          data['apkSizeMb'] = apk_size
          data['updateMessage'] = f'A new version of My Sadhana Card ({tag}) is available.'

          with open('update.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          "

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(release): auto-update update.json with exact APK size ($APK_SIZE_MB) for $TAG_NAME [skip ci]"
            git push origin HEAD:main
          fi
        shell: bash

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Sadhana-Card-Release-APK
          path: Sadhana-Card.apk
          retention-days: 30

      - name: Automatic GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ (startsWith(github.ref, 'refs/tags/') && github.ref_name) || steps.version_meta.outputs.tag_name }}
          name: ${{ (startsWith(github.ref, 'refs/tags/') && format('Sadhana Card {0}', github.ref_name)) || format('Sadhana Card {0}', steps.version_meta.outputs.tag_name) }}
          body: |
            - Point System Refactored to 200 Max Score (Bedtime: 25, Wake-up: 25, 16 Rounds: 50, Day Sleep: 25, Pathan: 25, Shravan: 25, Seva: 25)
            - Day Sleep (Nap) placed strictly after 16 Rounds Japa in daily breakdown & weekly matrix
            - Removed Travel / Train Journey allowance and Seva tag management
            - Synced score colors: Red (<75), Yellow (75-199), Green (200 Full Marks)
          files: |
            Sadhana-Card.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
